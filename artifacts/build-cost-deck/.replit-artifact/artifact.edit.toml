kind = "slides"
previewPath = "/build-cost-deck/"
title = "Estimasi Pembuatan Profit Insight Hub"
version = "1.0.0"
id = "artifacts/build-cost-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/build-cost-deck/" ]
localPort = 9000

[services.development]
run = "pnpm --filter @workspace/build-cost-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/build-cost-deck", "run", "build" ]
publicDir = "artifacts/build-cost-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "9000"
BASE_PATH = "/build-cost-deck/"
