<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arr3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="#ffffff"/>
  <text x="60" y="58" font-size="24" font-weight="700" fill="#0f172a">Clocking — Timesheet to Project Cost</text>
  <text x="60" y="86" font-size="14.5" fill="#64748b">Every approved hour flows straight into project cost and margin — no spreadsheets, no re-keying.</text>

  <!-- Lane labels -->
  <text x="60" y="160" font-size="13" font-weight="700" fill="#dc2626">CONSULTANT / TECHNICAL WRITER</text>
  <text x="60" y="330" font-size="13" font-weight="700" fill="#dc2626">PROJECT MANAGER</text>
  <line x1="60" y1="172" x2="1540" y2="172" stroke="#f1f5f9" stroke-width="2"/>
  <line x1="60" y1="342" x2="1540" y2="342" stroke="#f1f5f9" stroke-width="2"/>

  <!-- Log hours -->
  <rect x="60" y="190" width="300" height="110" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="222" font-size="16" font-weight="700" fill="#0f172a">Log hours</text>
  <text x="80" y="246" font-size="12.5" fill="#475569">Per project &amp; task, web or mobile app</text>
  <text x="80" y="266" font-size="12.5" fill="#475569">Saved as DRAFT — editable anytime</text>
  <rect x="80" y="276" width="64" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="112" y="290" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">DRAFT</text>

  <line x1="360" y1="245" x2="436" y2="245" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr3)"/>

  <!-- Submit -->
  <rect x="440" y="190" width="280" height="110" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="460" y="222" font-size="16" font-weight="700" fill="#0f172a">Submit for approval</text>
  <text x="460" y="246" font-size="12.5" fill="#475569">PM notified in-app (+ optional email)</text>
  <rect x="460" y="260" width="90" height="20" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="505" y="274" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">SUBMITTED</text>

  <!-- Submit -> Review (down to PM lane) -->
  <path d="M 720 245 C 800 245, 820 300, 820 356" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr3)"/>

  <!-- Review -->
  <rect x="700" y="360" width="300" height="120" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="720" y="392" font-size="16" font-weight="700" fill="#0f172a">Review in Approval Inbox</text>
  <text x="720" y="416" font-size="12.5" fill="#475569">Per entry or "Approve all submitted"</text>
  <text x="720" y="436" font-size="12.5" fill="#475569">Over-plan hours are flagged against</text>
  <text x="720" y="453" font-size="12.5" fill="#475569">the staffing plan</text>

  <!-- Rejected path back -->
  <path d="M 700 420 C 300 430, 210 380, 208 304" stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#arr3r)"/>
  <rect x="330" y="392" width="150" height="26" rx="13" fill="#fef2f2" stroke="#fecaca"/>
  <text x="405" y="410" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">REJECTED — revise</text>

  <!-- Approved -->
  <path d="M 1000 420 L 1076 420" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr3)"/>
  <rect x="1080" y="360" width="220" height="120" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="1100" y="392" font-size="16" font-weight="700" fill="#065f46">APPROVED</text>
  <text x="1100" y="416" font-size="12.5" fill="#047857">Hours are locked and</text>
  <text x="1100" y="434" font-size="12.5" fill="#047857">posted to the project</text>

  <line x1="1300" y1="420" x2="1376" y2="420" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr3)"/>

  <!-- Cost impact -->
  <rect x="1380" y="330" width="160" height="180" rx="12" fill="#0f172a"/>
  <text x="1460" y="368" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Project cost</text>
  <text x="1460" y="392" font-size="11.5" fill="#94a3b8" text-anchor="middle">(hours ÷ 8) × daily rate</text>
  <line x1="1400" y1="408" x2="1520" y2="408" stroke="#334155"/>
  <text x="1460" y="432" font-size="11.5" fill="#e2e8f0" text-anchor="middle">Margin recalculated</text>
  <text x="1460" y="452" font-size="11.5" fill="#e2e8f0" text-anchor="middle">Burn-rate forecast</text>
  <text x="1460" y="472" font-size="11.5" fill="#e2e8f0" text-anchor="middle">Utilization &amp; bench</text>
  <text x="1460" y="492" font-size="11.5" fill="#e2e8f0" text-anchor="middle">40h/week compliance</text>

  <text x="60" y="530" font-size="13" fill="#94a3b8">Consultants only ever see their own hours. Daily rates are visible to Management and PMs only — the server redacts them for everyone else.</text>
</svg>
