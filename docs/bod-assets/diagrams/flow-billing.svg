<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="#ffffff"/>
  <text x="60" y="58" font-size="24" font-weight="700" fill="#0f172a">Billing — Milestones to Cash, Synced with Xero</text>
  <text x="60" y="86" font-size="14.5" fill="#64748b">Terms of Payment are planned up front; invoicing and payment status flow between SecureProfit Hub and Xero automatically.</text>

  <!-- Billing plan -->
  <rect x="60" y="140" width="330" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="172" font-size="16" font-weight="700" fill="#0f172a">1 · Billing plan (ToP)</text>
  <text x="80" y="198" font-size="12.5" fill="#475569">Milestones as % of contract value</text>
  <text x="80" y="218" font-size="12.5" fill="#475569">e.g. 30% DP · 40% Mid · 30% BAST</text>
  <text x="80" y="238" font-size="12.5" fill="#475569">Must total 100% before ACTIVE</text>
  <text x="80" y="258" font-size="12.5" fill="#475569">DPP &amp; VAT 11% split automatic</text>

  <line x1="390" y1="215" x2="446" y2="215" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr4)"/>

  <!-- Invoice -->
  <rect x="450" y="140" width="330" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="470" y="172" font-size="16" font-weight="700" fill="#0f172a">2 · Invoice the milestone</text>
  <text x="470" y="198" font-size="12.5" fill="#475569">Sequential number INV/YYYY/MM/NNNN</text>
  <text x="470" y="218" font-size="12.5" fill="#475569">Printable invoice PDF</text>
  <text x="470" y="238" font-size="12.5" fill="#475569">One click "Send to Xero"</text>
  <rect x="470" y="252" width="86" height="20" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="513" y="266" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">INVOICED</text>

  <line x1="780" y1="215" x2="836" y2="215" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr4)"/>

  <!-- Xero -->
  <rect x="840" y="140" width="330" height="150" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="860" y="172" font-size="16" font-weight="700" fill="#1e40af">3 · Xero (accounting)</text>
  <text x="860" y="198" font-size="12.5" fill="#1d4ed8">Invoice created in the ledger</text>
  <text x="860" y="218" font-size="12.5" fill="#1d4ed8">Finance tracks payment in Xero</text>
  <text x="860" y="238" font-size="12.5" fill="#1d4ed8">Client pays the invoice</text>
  <text x="860" y="258" font-size="12.5" fill="#1d4ed8">"Sync from Xero" pulls status back</text>

  <line x1="1170" y1="215" x2="1226" y2="215" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr4)"/>

  <!-- Paid -->
  <rect x="1230" y="140" width="310" height="150" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="1250" y="172" font-size="16" font-weight="700" fill="#065f46">4 · PAID</text>
  <text x="1250" y="198" font-size="12.5" fill="#047857">Milestone marked PAID only when</text>
  <text x="1250" y="218" font-size="12.5" fill="#047857">Xero confirms full payment</text>
  <text x="1250" y="238" font-size="12.5" fill="#047857">Revenue &amp; cash-flow views update</text>
  <text x="1250" y="258" font-size="12.5" fill="#047857">instantly</text>

  <!-- Feeds row -->
  <path d="M 1385 290 L 1385 336" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr4)"/>
  <rect x="60" y="340" width="1480" height="130" rx="12" fill="#0f172a"/>
  <text x="90" y="378" font-size="15" font-weight="700" fill="#ffffff">Feeds Management reporting automatically</text>
  <text x="90" y="408" font-size="13" fill="#e2e8f0">• Invoice Planning — every milestone bucketed by due date, so cash-in is predictable</text>
  <text x="90" y="431" font-size="13" fill="#e2e8f0">• VAT Recap — 12-month + annual VAT breakdown of invoiced and paid milestones, ready for tax reporting</text>
  <text x="90" y="454" font-size="13" fill="#e2e8f0">• Outstanding invoices &amp; collection risk highlighted in the Executive Copilot briefing</text>

  <text x="60" y="510" font-size="13" fill="#94a3b8">Invoice numbers are unique and allocated safely even under concurrent use. Only Management and Finance can access accounting-level views.</text>
</svg>
