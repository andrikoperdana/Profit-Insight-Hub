<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1600" height="500" fill="#ffffff"/>
  <text x="60" y="52" font-size="24" font-weight="700" fill="#0f172a">Project Status Lifecycle</text>
  <text x="60" y="80" font-size="14.5" fill="#64748b">Status changes are guarded by gates — a project cannot advance</text>
  <text x="60" y="100" font-size="14.5" fill="#64748b">until the checklist for the next stage is complete.</text>

  <!-- DRAFT -->
  <rect x="60" y="200" width="210" height="90" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="165" y="238" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">DRAFT</text>
  <text x="165" y="262" font-size="12.5" fill="#64748b" text-anchor="middle">Sales project request</text>

  <line x1="270" y1="245" x2="356" y2="245" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr2)"/>
  <text x="313" y="228" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">PM assigned</text>

  <!-- OBSERVATION -->
  <rect x="360" y="200" width="230" height="90" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="475" y="238" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">OBSERVATION</text>
  <text x="475" y="262" font-size="12.5" fill="#a16207" text-anchor="middle">PM prepares the project</text>

  <line x1="590" y1="245" x2="716" y2="245" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr2)"/>
  <text x="653" y="228" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">READINESS GATE</text>
  <text x="653" y="322" font-size="11.5" fill="#64748b" text-anchor="middle">team · tasks · risks</text>
  <text x="653" y="338" font-size="11.5" fill="#64748b" text-anchor="middle">billing plan = 100%</text>
  <line x1="653" y1="250" x2="653" y2="306" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- ACTIVE -->
  <rect x="720" y="200" width="230" height="90" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="835" y="238" font-size="18" font-weight="700" fill="#065f46" text-anchor="middle">ACTIVE</text>
  <text x="835" y="262" font-size="12.5" fill="#047857" text-anchor="middle">Delivery in progress</text>

  <!-- PAUSE above ACTIVE -->
  <rect x="735" y="88" width="200" height="66" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="835" y="116" font-size="16" font-weight="700" fill="#9a3412" text-anchor="middle">PAUSE</text>
  <text x="835" y="138" font-size="12" fill="#c2410c" text-anchor="middle">Temporarily on hold</text>
  <path d="M 805 200 C 795 184, 795 172, 805 154" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
  <path d="M 865 154 C 875 172, 875 184, 865 200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr2)"/>

  <line x1="950" y1="245" x2="1116" y2="245" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr2)"/>
  <text x="1033" y="228" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">COMPLETION GATE</text>
  <text x="1033" y="322" font-size="11.5" fill="#64748b" text-anchor="middle">all tasks done · approvals clear</text>
  <text x="1033" y="338" font-size="11.5" fill="#64748b" text-anchor="middle">all milestones invoiced · BAST uploaded</text>
  <line x1="1033" y1="250" x2="1033" y2="306" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- COMPLETE -->
  <rect x="1120" y="200" width="210" height="90" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="1225" y="238" font-size="18" font-weight="700" fill="#1e40af" text-anchor="middle">COMPLETE</text>
  <text x="1225" y="262" font-size="12.5" fill="#1d4ed8" text-anchor="middle">Delivered &amp; accepted</text>

  <line x1="1330" y1="245" x2="1416" y2="245" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr2)"/>
  <text x="1373" y="228" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">archive</text>

  <!-- CLOSED -->
  <rect x="1420" y="200" width="140" height="90" rx="12" fill="#0f172a"/>
  <text x="1490" y="238" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">CLOSED</text>
  <text x="1490" y="262" font-size="12.5" fill="#94a3b8" text-anchor="middle">Read-only</text>

  <text x="60" y="420" font-size="13" fill="#94a3b8">Gates are enforced by the server for every role, including Management. A blocked transition returns the exact list of missing items,</text>
  <text x="60" y="440" font-size="13" fill="#94a3b8">so the PM always knows what remains. Internal / pre-sales / training projects skip the commercial (billing &amp; BAST) requirements.</text>
</svg>
