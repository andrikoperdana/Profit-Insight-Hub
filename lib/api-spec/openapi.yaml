openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SecureProfit Hub API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: clients
  - name: projects
  - name: resources
  - name: timesheets
  - name: documents
  - name: expenses
  - name: tasks
  - name: dashboard
  - name: notifications
  - name: report

paths:
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }

  /users/available:
    get:
      operationId: listAvailableUsers
      tags: [users]
      parameters:
        - name: role
          in: query
          required: true
          schema: { $ref: "#/components/schemas/UserRole" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AvailableUser" }

  /projects/{id}/report:
    patch:
      operationId: updateProjectReport
      tags: [report]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectReportBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /users:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      operationId: createUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      operationId: updateUser
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    delete:
      operationId: deleteUser
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Client" }
    post:
      operationId: createClient
      tags: [clients]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClientBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }

  /clients/{id}:
    patch:
      operationId: updateClient
      tags: [clients]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClientBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
    delete:
      operationId: deleteClient
      tags: [clients]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
    patch:
      operationId: updateProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
    delete:
      operationId: deleteProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /projects/{id}/financials:
    get:
      operationId: getProjectFinancials
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectFinancials" }

  /projects/{id}/resources:
    get:
      operationId: listProjectResources
      tags: [resources]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectResource" }
    post:
      operationId: addProjectResource
      tags: [resources]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddResourceBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResource" }

  /resources/{resourceId}:
    delete:
      operationId: removeProjectResource
      tags: [resources]
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /projects/{id}/resources/propose:
    post:
      operationId: proposeProjectResource
      tags: [resources]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddResourceBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResource" }

  /resources/{resourceId}/accept:
    post:
      operationId: acceptProjectResource
      tags: [resources]
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /principal/projects-needing-resource:
    get:
      operationId: listProjectsNeedingResource
      tags: [principal]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }

  /users/under-supervision:
    get:
      operationId: listUsersUnderSupervision
      tags: [users]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }

  /projects/{id}/expenses:
    get:
      operationId: listProjectExpenses
      tags: [expenses]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectExpense" }
    post:
      operationId: addProjectExpense
      tags: [expenses]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddProjectExpenseBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectExpense" }

  /expenses/{expenseId}:
    delete:
      operationId: removeProjectExpense
      tags: [expenses]
      parameters:
        - { name: expenseId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /timesheets:
    get:
      operationId: listTimesheets
      tags: [timesheets]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: projectId, in: query, required: false, schema: { type: string } }
        - { name: scope, in: query, required: false, schema: { type: string, enum: [mine, approval, all] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Timesheet" }
    post:
      operationId: createTimesheet
      tags: [timesheets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTimesheetBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timesheet" }

  /timesheets/{id}/submit:
    post:
      operationId: submitTimesheet
      tags: [timesheets]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timesheet" }

  /timesheets/{id}/approve:
    post:
      operationId: approveTimesheet
      tags: [timesheets]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timesheet" }

  /timesheets/{id}/reject:
    post:
      operationId: rejectTimesheet
      tags: [timesheets]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectTimesheetBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timesheet" }

  /timesheets/{id}:
    delete:
      operationId: deleteTimesheet
      tags: [timesheets]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /projects/{id}/documents:
    get:
      operationId: listProjectDocuments
      tags: [documents]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Document" }
    post:
      operationId: createProjectDocument
      tags: [documents]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDocumentBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }

  /documents/{id}:
    delete:
      operationId: deleteDocument
      tags: [documents]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /projects/{id}/tasks:
    get:
      operationId: listProjectTasks
      tags: [tasks]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
    post:
      operationId: createProjectTask
      tags: [tasks]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }

  /tasks/mine:
    get:
      operationId: listMyTasks
      tags: [tasks]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }

  /tasks/{taskId}:
    patch:
      operationId: updateTask
      tags: [tasks]
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
    delete:
      operationId: deleteTask
      tags: [tasks]
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /tasks/{taskId}/time-logs:
    get:
      operationId: listTaskTimeLogs
      tags: [tasks]
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskTimeLog" }
    post:
      operationId: logTaskTime
      tags: [tasks]
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogTaskTimeBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskTimeLog" }

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /dashboard/profit-trend:
    get:
      operationId: getProfitTrend
      tags: [dashboard]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProfitTrendPoint" }

  /dashboard/status-breakdown:
    get:
      operationId: getStatusBreakdown
      tags: [dashboard]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StatusCount" }

  /dashboard/top-projects:
    get:
      operationId: getTopProjects
      tags: [dashboard]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityItem" }

  /dashboard/utilization:
    get:
      operationId: getUtilization
      tags: [dashboard]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UtilizationRow" }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    SuccessMessage:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        message: { type: string }

    UserRole:
      type: string
      enum: [MANAGEMENT, PROJECT_MANAGER, SALES, KONSULTAN, TECHNICAL_WRITER, ADMIN_PROJECT, PRINCIPAL_KONSULTAN, PRINCIPAL_TECHNICAL_WRITER, PRINCIPAL_ADMIN_PROJECT, SITE_ADMIN]

    ProjectStatus:
      type: string
      enum: [DRAFT, OBSERVATION, ACTIVE, NO_NEED_CONSULTANT, PAUSE, COMPLETE, CLOSED]

    TimesheetStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED]

    DocumentType:
      type: string
      enum: [BAST, INVOICE, CONTRACT, OTHER]

    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, BLOCKED, DONE]

    Task:
      type: object
      required: [id, projectId, title, status, loggedHours, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        projectCode: { type: string, nullable: true }
        projectName: { type: string, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/TaskStatus" }
        startDate: { type: string, nullable: true }
        endDate: { type: string, nullable: true }
        assigneeId: { type: string, nullable: true }
        assigneeName: { type: string, nullable: true }
        createdById: { type: string, nullable: true }
        createdByName: { type: string, nullable: true }
        loggedHours: { type: number }
        createdAt: { type: string }
        updatedAt: { type: string }

    CreateTaskBody:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/TaskStatus" }
        startDate: { type: string, nullable: true }
        endDate: { type: string, nullable: true }
        assigneeId: { type: string, nullable: true }

    UpdateTaskBody:
      type: object
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/TaskStatus" }
        startDate: { type: string, nullable: true }
        endDate: { type: string, nullable: true }
        assigneeId: { type: string, nullable: true }

    TaskTimeLog:
      type: object
      required: [id, taskId, userId, hours, loggedAt, createdAt]
      properties:
        id: { type: string }
        taskId: { type: string }
        userId: { type: string }
        userName: { type: string, nullable: true }
        hours: { type: number }
        note: { type: string, nullable: true }
        loggedAt: { type: string }
        createdAt: { type: string }

    LogTaskTimeBody:
      type: object
      required: [hours]
      properties:
        hours: { type: number }
        note: { type: string }
        loggedAt: { type: string }

    User:
      type: object
      required: [id, email, name, role, isActive, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        title: { type: string, nullable: true }
        dailyRate: { type: number, nullable: true }
        isActive: { type: boolean }
        managerId: { type: string, nullable: true }
        principalId: { type: string, nullable: true }
        createdAt: { type: string }

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    CreateUserBody:
      type: object
      required: [email, password, name, role]
      properties:
        email: { type: string }
        password: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        title: { type: string }
        dailyRate: { type: number }
        managerId: { type: string, nullable: true }
        principalId: { type: string, nullable: true }

    UpdateUserBody:
      type: object
      properties:
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        title: { type: string }
        dailyRate: { type: number }
        isActive: { type: boolean }
        password: { type: string }
        managerId: { type: string, nullable: true }
