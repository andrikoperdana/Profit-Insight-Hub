        expectedRevenueThisQuarter: { type: number }
        funnel:
          type: object
          additionalProperties: { type: integer }
        conversionRates:
          type: array
          items: { $ref: "#/components/schemas/LeadConversionRate" }
        lostReasonBreakdown:
          type: object
          additionalProperties: { $ref: "#/components/schemas/LeadLostBucket" }
        windowFrom: { type: string }
        windowTo: { type: string }

    CreateLeadBody:
      type: object
      required: [title]
      properties:
        title: { type: string }
        contactName: { type: string }
        contactEmail: { type: string }
        contactPhone: { type: string }
        clientId: { type: string, nullable: true }
        prospectiveClientName: { type: string }
        industry: { type: string }
        source: { type: string }
        stage: { $ref: "#/components/schemas/LeadStage" }
        estimatedValue: { type: number }
        probability: { type: integer }
        expectedCloseDate: { type: string, nullable: true }
        ownerId: { type: string }
        notes: { type: string }

    UpdateLeadBody:
      type: object
