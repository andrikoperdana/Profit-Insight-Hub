openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SecureProfit Hub API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: clients
  - name: projects
  - name: resources
  - name: timesheets
  - name: documents
  - name: expenses
  - name: tasks
  - name: dashboard
  - name: notifications
  - name: report
  - name: reports

paths:
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReportMeta" }
  /reports/options:
    get:
      operationId: getReportOptions
      tags: [reports]
      parameters:
        - { name: source, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReportFilterOption" }
  /reports/{id}:
    get:
      operationId: executeReport
      tags: [reports]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportResult" }

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }

  /users/available:
    get:
      operationId: listAvailableUsers
      tags: [users]
      parameters:
        - name: role
          in: query
          required: true
          schema: { $ref: "#/components/schemas/UserRole" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AvailableUser" }

  /users/active-all:
    get:
      operationId: listActiveAllUsers
      tags: [users]
      description: |
        Returns all active users regardless of role. Available to MANAGEMENT and
        PROJECT_MANAGER. Used by the project Resources tab to assign "other"
        resources (Sales, SOC Manager, Security Engineer, etc.) with a free-text
        project role.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActiveUser" }

  /projects/{id}/report:
    patch:
      operationId: updateProjectReport
      tags: [report]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectReportBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /users:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      operationId: createUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      operationId: updateUser
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    delete:
      operationId: deleteUser
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Lead" }
    post:
      operationId: createLead
      tags: [leads]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLeadBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }

  /leads/{id}:
    patch:
      operationId: updateLead
      tags: [leads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLeadBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
    delete:
      operationId: deleteLead
      tags: [leads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /leads/analytics:
    get:
      operationId: getLeadsAnalytics
      tags: [leads]
      parameters:
        - { name: from, in: query, required: false, schema: { type: string } }
        - { name: to, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadAnalytics" }

  /leads/{id}/activities:
    get:
      operationId: listLeadActivities
      tags: [leads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeadActivity" }
    post:
      operationId: createLeadActivity
      tags: [leads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLeadActivityBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadActivity" }

  /leads/{id}/activities/{activityId}:
    patch:
      operationId: updateLeadActivity
      tags: [leads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: activityId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLeadActivityBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadActivity" }
    delete:
      operationId: deleteLeadActivity
      tags: [leads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: activityId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /leads/import:
    post:
      operationId: importLeads
      tags: [leads]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportLeadsBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportLeadsResult" }

  /leads/{id}/convert:
    post:
      operationId: convertLead
      tags: [leads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConvertLeadBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConvertLeadResult" }

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Client" }
    post:
      operationId: createClient
      tags: [clients]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClientBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }

  /clients/{id}:
    patch:
      operationId: updateClient
      tags: [clients]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClientBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
    delete:
      operationId: deleteClient
      tags: [clients]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
    patch:
      operationId: updateProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
    delete:
      operationId: deleteProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /projects/{id}/financials:
    get:
      operationId: getProjectFinancials
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectFinancials" }

  /projects/{id}/resources:
    get:
      operationId: listProjectResources
      tags: [resources]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectResource" }
    post:
      operationId: addProjectResource
      tags: [resources]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddResourceBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResource" }

  /resources/{resourceId}:
    delete:
      operationId: removeProjectResource
      tags: [resources]
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /projects/{id}/resources/propose:
    post:
      operationId: proposeProjectResource
      tags: [resources]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddResourceBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResource" }

  /resources/{resourceId}/accept:
    post:
      operationId: acceptProjectResource
      tags: [resources]
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /principal/projects-needing-resource:
    get:
      operationId: listProjectsNeedingResource
      tags: [principal]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }

  /users/under-supervision:
    get:
      operationId: listUsersUnderSupervision
      tags: [users]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }

  /projects/{id}/expenses:
    get:
      operationId: listProjectExpenses
      tags: [expenses]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectExpense" }
    post:
      operationId: addProjectExpense
      tags: [expenses]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddProjectExpenseBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectExpense" }

  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      description: |
        Cross-project expense listing. Management sees all; Project Manager sees
        own projects; Sales sees own projects; other roles get 403.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectExpense" }

  /expenses/{expenseId}:
    delete:
      operationId: removeProjectExpense
      tags: [expenses]
      parameters:
        - { name: expenseId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /expenses/{expenseId}/approve:
    post:
      operationId: approveProjectExpense
      tags: [expenses]
      description: PM-of-project or MANAGEMENT approves a PENDING expense. APPROVED expenses count toward project actualCost.
      parameters:
        - { name: expenseId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectExpense" }

  /expenses/{expenseId}/reject:
    post:
      operationId: rejectProjectExpense
      tags: [expenses]
      description: PM-of-project or MANAGEMENT rejects a PENDING expense with a reason.
      parameters:
        - { name: expenseId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectExpense" }

  /business-units:
    get:
      operationId: listBusinessUnits
      tags: [business-units]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BusinessUnit" }
    post:
      operationId: createBusinessUnit
      tags: [business-units]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBusinessUnitBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessUnit" }

  /business-units/{id}:
    patch:
      operationId: updateBusinessUnit
      tags: [business-units]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBusinessUnitBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessUnit" }
    delete:
      operationId: deleteBusinessUnit
      tags: [business-units]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /skills:
    get:
      operationId: listSkills
      tags: [skills]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Skill" }
    post:
      operationId: createSkill
      tags: [skills]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSkillBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }

  /skills/{id}:
    patch:
      operationId: updateSkill
      tags: [skills]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSkillBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
    delete:
      operationId: deleteSkill
      tags: [skills]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /resource-planning:
    get:
      operationId: getResourcePlanning
      tags: [resource-planning]
      description: Returns matrix of users grouped by Business Unit with allocations across a date window.
      parameters:
        - { name: startDate, in: query, required: false, schema: { type: string }, description: "ISO date YYYY-MM-DD; defaults to start of current week" }
        - { name: weeks,     in: query, required: false, schema: { type: integer, minimum: 1, maximum: 26 }, description: "Number of weeks (default 8)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourcePlanningMatrix" }

  /invoice-planning:
    get:
      operationId: getInvoicePlanning
      tags: [invoice-planning]
      description: Returns matrix of projects grouped by PM's Business Unit with billing milestones bucketed across weekly or monthly periods.
      parameters:
        - { name: startDate, in: query, required: false, schema: { type: string }, description: "ISO date YYYY-MM-DD; defaults to start of current period" }
        - { name: periods,   in: query, required: false, schema: { type: integer, minimum: 1, maximum: 26 }, description: "Number of periods (weekly default 8, monthly default 6)" }
        - { name: mode,      in: query, required: false, schema: { type: string, enum: [week, month] }, description: "Period granularity (default week)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePlanningMatrix" }

  /timesheets:
    get:
      operationId: listTimesheets
      tags: [timesheets]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: projectId, in: query, required: false, schema: { type: string } }
        - { name: scope, in: query, required: false, schema: { type: string, enum: [mine, approval, all] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Timesheet" }
    post:
      operationId: createTimesheet
      tags: [timesheets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTimesheetBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timesheet" }

  /timesheets/{id}/submit:
    post:
