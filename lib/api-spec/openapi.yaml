            schema: { $ref: "#/components/schemas/UpdatePipedriveStageMappingsBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipedriveStageMappingsResponse" }

  /executive-copilot/briefing:
    get:
      operationId: getExecutiveBriefing
      tags: [executive-copilot]
      summary: Return the most recently generated executive briefing (cached, no AI call).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutiveBriefingState" }

  /executive-copilot/briefing/generate:
    post:
      operationId: generateExecutiveBriefing
      tags: [executive-copilot]
      summary: Generate a fresh AI executive briefing from current portfolio data (incurs AI cost).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutiveBriefingResult" }

  /ai/assistant/chat:
    post:
      operationId: aiAssistantChat
      tags: [ai]
      summary: Ask the AI data assistant a question (tool-calling over live, role-scoped data).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiChatBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatResponse" }

  /ai/report-draft:
    post:
      operationId: generateAiReportDraft
      tags: [ai]
      summary: Generate an AI project report draft for a given month (project PM/TW or management).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiReportDraftBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiReportDraftResult" }

  /ai/weekly-digest:
    get:
      operationId: getAiWeeklyDigest
      tags: [ai]
      summary: Return the latest stored AI weekly digest (management only, no AI call).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiWeeklyDigestState" }

  /ai/weekly-digest/generate:
    post:
      operationId: generateAiWeeklyDigest
      tags: [ai]
      summary: Generate (or regenerate) this week's AI digest now (management only, incurs AI cost).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiWeeklyDigestResult" }

components:
  schemas:
    ExecutiveCopilotPortfolioFacts:
      type: object
      required:
        [
          totalProjects,
          activeProjects,
          clientProjects,
          totalContractValue,
          totalRecognizedRevenue,
          totalActualCost,
          totalActualProfit,
          weightedMarginPct,
          portfolioHealthScore,
          healthLabel,
        ]
      properties:
        totalProjects: { type: integer }
        activeProjects: { type: integer }
        clientProjects: { type: integer }
        totalContractValue: { type: number }
        totalRecognizedRevenue: { type: number }
        totalActualCost: { type: number }
        totalActualProfit: { type: number }
        weightedMarginPct: { type: number }
        portfolioHealthScore: { type: number }
        healthLabel: { type: string }

    ExecutiveCopilotUtilizationFacts:
      type: object
      required:
        [headcount, billableActive, idle, overloaded, idleLong, utilizationPct]
      properties:
        headcount: { type: integer }
        billableActive: { type: integer }
        idle: { type: integer }
        overloaded: { type: integer }
        idleLong: { type: integer }
        utilizationPct: { type: number }

    ExecutiveCopilotCashFlowFacts:
      type: object
      required:
        [plannedNext30Days, plannedNext90Days, outstandingInvoicedAmount, paidLast90Days]
      properties:
        plannedNext30Days: { type: number }
        plannedNext90Days: { type: number }
        outstandingInvoicedAmount: { type: number }
        paidLast90Days: { type: number }

    ExecutiveCopilotInvoiceFacts:
      type: object
      required:
        [invoicedCount, invoicedAmount, paidAmount, outstandingAmount, plannedCount, plannedAmount]
      properties:
        invoicedCount: { type: integer }
        invoicedAmount: { type: number }
        paidAmount: { type: number }
        outstandingAmount: { type: number }
        plannedCount: { type: integer }
        plannedAmount: { type: number }

    ExecutiveCopilotDelayedProject:
      type: object
      required: [id, code, name, status, daysOverdue]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        status: { type: string }
        endDate: { type: string, nullable: true }
        daysOverdue: { type: integer }

    ExecutiveCopilotRiskProject:
      type: object
      required: [id, code, name, openCritical, openHigh]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        openCritical: { type: integer }
        openHigh: { type: integer }
        healthScore: { type: number, nullable: true }

    ExecutiveCopilotFacts:
      type: object
      required:
        [portfolio, utilization, cashFlow, invoices, delayedProjects, highRiskProjects]
      properties:
        portfolio: { $ref: "#/components/schemas/ExecutiveCopilotPortfolioFacts" }
        utilization: { $ref: "#/components/schemas/ExecutiveCopilotUtilizationFacts" }
        cashFlow: { $ref: "#/components/schemas/ExecutiveCopilotCashFlowFacts" }
        invoices: { $ref: "#/components/schemas/ExecutiveCopilotInvoiceFacts" }
        delayedProjects:
          type: array
          items: { $ref: "#/components/schemas/ExecutiveCopilotDelayedProject" }
        highRiskProjects:
          type: array
          items: { $ref: "#/components/schemas/ExecutiveCopilotRiskProject" }

    ExecutiveBriefingAction:
      type: object
      required: [title, detail, priority]
      properties:
        title: { type: string }
        detail: { type: string }
        priority: { type: string, enum: [HIGH, MEDIUM, LOW] }

    ExecutiveBriefingNarrative:
      type: object
      required:
        [
          headline,
          healthLabel,
          portfolioHealthScore,
          revenueSummary,
          marginSummary,
          utilizationSummary,
          cashFlowSummary,
          outstandingInvoicesSummary,
          consultantAvailabilitySummary,
          delayedProjectsSummary,
          highRiskProjectsSummary,
          recommendedActions,
        ]
      properties:
        headline: { type: string }
        healthLabel: { type: string }
        portfolioHealthScore: { type: number }
        revenueSummary: { type: string }
        marginSummary: { type: string }
        utilizationSummary: { type: string }
        cashFlowSummary: { type: string }
        outstandingInvoicesSummary: { type: string }
        consultantAvailabilitySummary: { type: string }
        delayedProjectsSummary: { type: string }
        highRiskProjectsSummary: { type: string }
        recommendedActions:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/ExecutiveBriefingAction" }

    ExecutiveBriefingResult:
      type: object
      required: [generatedAt, model, facts, briefing]
      properties:
        generatedAt: { type: string }
        model: { type: string }
        stale: { type: boolean }
        facts: { $ref: "#/components/schemas/ExecutiveCopilotFacts" }
        briefing: { $ref: "#/components/schemas/ExecutiveBriefingNarrative" }

    ExecutiveBriefingState:
      type: object
      required: [hasBriefing]
      properties:
        hasBriefing: { type: boolean }
        result:
          allOf: [{ $ref: "#/components/schemas/ExecutiveBriefingResult" }]
          nullable: true

    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    SuccessMessage:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        message: { type: string }

    XeroStatus:
      type: object
      required: [connected, configured]
      properties:
        connected: { type: boolean }
        configured: { type: boolean }
        tenantName: { type: string, nullable: true }
        connectedAt: { type: string, nullable: true }

    XeroConnectUrl:
      type: object
      required: [url]
      properties:
        url: { type: string }

    XeroSyncResult:
      type: object
      required: [checked, updated]
      properties:
        checked: { type: integer }
        updated: { type: integer }

    XeroClientSyncResult:
      type: object
      required: [id, xeroContactId]
      properties:
        id: { type: string }
        xeroContactId: { type: string }

    XeroInvoiceResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/BillingMilestoneStatus" }
        xeroInvoiceId: { type: string, nullable: true }
        xeroInvoiceNumber: { type: string, nullable: true }
        invoiceNumber: { type: string, nullable: true }

    PipedriveStatus:
      type: object
      required:
        [
          connected,
          autoSyncEnabled,
          importedLeadCount,
          linkedClientCount,
          stageMappingCount,
          sync,
        ]
      properties:
        connected: { type: boolean }
        autoSyncEnabled: { type: boolean }
        lastSyncAt: { type: string, nullable: true }
        defaultOwnerId: { type: string, nullable: true }
        importedLeadCount: { type: integer }
        linkedClientCount: { type: integer }
        stageMappingCount: { type: integer }
        sync: { $ref: "#/components/schemas/PipedriveSyncState" }

    PipedriveSyncState:
      type: object
      required: [running, startedAt, finishedAt, runId, error, result]
      properties:
        running: { type: boolean }
        startedAt: { type: string, nullable: true }
        finishedAt: { type: string, nullable: true }
        runId: { type: string, nullable: true }
        error: { type: string, nullable: true }
        result:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PipedriveSyncResultSummary"

    PipedriveSyncResultSummary:
      type: object
      required: [imported, updated, skipped, errorCount]
      properties:
        imported: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        errorCount: { type: integer }

    PipedriveSyncStartResponse:
      type: object
      required: [started, runId]
      properties:
        started: { type: boolean }
        runId: { type: string }

    PipedriveStageMapping:
      type: object
      required: [id, pipedrivePipelineId, pipedriveStageId, leadStage, updatedAt]
      properties:
        id: { type: string }
        pipedrivePipelineId: { type: integer }
        pipedriveStageId: { type: integer }
        leadStage: { $ref: "#/components/schemas/LeadStage" }
        label: { type: string, nullable: true }
        updatedAt: { type: string }

    PipedriveStage:
      type: object
      required: [id]
      properties:
        id: { type: integer }
        name: { type: string, nullable: true }
        pipelineId: { type: integer, nullable: true }
        orderNr: { type: integer, nullable: true }

    PipedriveStageMappingsResponse:
      type: object
      required: [mappings]
      properties:
        mappings:
          type: array
          items: { $ref: "#/components/schemas/PipedriveStageMapping" }
        stages:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/PipedriveStage" }

    UpdatePipedriveSettingsBody:
      type: object
      properties:
        autoSyncEnabled: { type: boolean }
        defaultOwnerId: { type: string, nullable: true }

    UpdatePipedriveStageMappingsBody:
      type: object
      required: [mappings]
      properties:
        mappings:
          type: array
          items:
            type: object
            required: [pipedrivePipelineId, pipedriveStageId, leadStage]
            properties:
              pipedrivePipelineId: { type: integer }
              pipedriveStageId: { type: integer }
              leadStage: { $ref: "#/components/schemas/LeadStage" }
              label: { type: string, nullable: true }

    UserRole:
      type: string
      enum: [MANAGEMENT, PROJECT_MANAGER, SALES, KONSULTAN, TECHNICAL_WRITER, ADMIN_PROJECT, PRINCIPAL_KONSULTAN, PRINCIPAL_TECHNICAL_WRITER, PRINCIPAL_ADMIN_PROJECT, FINANCE, HR, SITE_ADMIN, SUPER_ADMIN]

    ProjectStatus:
      type: string
      enum: [DRAFT, OBSERVATION, ACTIVE, NO_NEED_CONSULTANT, PAUSE, COMPLETE, CLOSED]

    ProjectKind:
      type: string
      enum: [CLIENT, INTERNAL, PRESALES, TRAINING]
      description: |
        Project category. CLIENT = paid engagement (default, all financial
        reports include). INTERNAL/PRESALES/TRAINING = non-billable initiatives
        excluded from VAT recap, billing aging, cash inflow forecast, and
        PPN detail reports.

    TimesheetStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED]

    DocumentType:
      type: string
      enum: [BAST, INVOICE, CONTRACT, REPORT, OTHER]

    DocumentKind:
      type: string
      enum: [FILE, LINK]

    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, BLOCKED, DONE]

    Seniority:
      type: string
      enum: [JUNIOR, MID, SENIOR, PRINCIPAL]

    ExpenseStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    TaskAssignee:
      type: object
      required: [userId, name]
      properties:
        userId: { type: string }
        name: { type: string }

    VatRecapMonth:
      type: object
      required: [month, monthLabel, milestoneCount, invoicedCount, paidCount, totalGross, totalDPP, totalVat, paidVat, outstandingVat]
      properties:
        month: { type: string, description: "YYYY-MM" }
        monthLabel: { type: string }
        milestoneCount: { type: integer }
        invoicedCount: { type: integer }
        paidCount: { type: integer }
        totalGross: { type: number }
        totalDPP: { type: number }
        totalVat: { type: number }
        paidVat: { type: number }
        outstandingVat: { type: number }

    VatRecapTotals:
      type: object
      required: [milestoneCount, totalGross, totalDPP, totalVat, paidVat, outstandingVat]
      properties:
        milestoneCount: { type: integer }
        totalGross: { type: number }
        totalDPP: { type: number }
        totalVat: { type: number }
        paidVat: { type: number }
        outstandingVat: { type: number }

    TopPerformerMetricDef:
      type: object
      required: [key, label, weight]
      properties:
        key: { type: string }
        label: { type: string }
        weight: { type: number }
        invert: { type: boolean }
        format: { type: string, enum: [pct, number, hours, currency] }
    TopPerformerBreakdownEntry:
      type: object
      required: [raw, normalized, weighted]
      properties:
        raw: { type: number }
        normalized: { type: number }
        weighted: { type: number }
    TopPerformerItem:
      type: object
      required: [userId, name, email, score, eligible, breakdown, activeMonths]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string }
        avatarDataUrl: { type: string, nullable: true }
        seniority: { type: string, nullable: true }
        businessUnitId: { type: string, nullable: true }
        businessUnitName: { type: string, nullable: true }
        isActive: { type: boolean }
        activeMonths: { type: integer }
        eligible: { type: boolean }
        rank: { type: integer }
        score: { type: number }
        breakdown:
          type: object
          additionalProperties: { $ref: "#/components/schemas/TopPerformerBreakdownEntry" }
    TopPerformersResponse:
      type: object
      required: [year, role, page, pageSize, total, weights, items]
      properties:
        year: { type: integer }
        role: { type: string }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        weights:
          type: array
          items: { $ref: "#/components/schemas/TopPerformerMetricDef" }
        items:
          type: array
          items: { $ref: "#/components/schemas/TopPerformerItem" }
    VatRecap:
      type: object
      required: [year, months, totals]
      properties:
        year: { type: integer }
        months:
          type: array
          items: { $ref: "#/components/schemas/VatRecapMonth" }
        totals: { $ref: "#/components/schemas/VatRecapTotals" }

    BillingMilestoneStatus:
      type: string
      enum: [PLANNED, INVOICED, PAID, CANCELLED]

    BillingMilestone:
      type: object
      required: [id, projectId, name, percentage, status, sortOrder, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        workstreamId: { type: string, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        percentage: { type: number }
        amount: { type: number, nullable: true }
        dueDate: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/BillingMilestoneStatus" }
        invoiceNumber: { type: string, nullable: true }
        xeroInvoiceId: { type: string, nullable: true }
        xeroInvoiceNumber: { type: string, nullable: true }
        xeroAmountDue: { type: number, nullable: true }
        xeroAmountPaid: { type: number, nullable: true }
        xeroAmountCredited: { type: number, nullable: true }
        xeroSyncedAt: { type: string, nullable: true }
        invoicedAt: { type: string, nullable: true }
        paidAt: { type: string, nullable: true }
        reportUrl: { type: string, nullable: true }
        reportFiledAt: { type: string, nullable: true }
        sortOrder: { type: integer }
        bastDocumentId: { type: string, nullable: true }
        bastFileName: { type: string, nullable: true }
        bastUploadedAt: { type: string, nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }

    CreateBillingMilestoneBody:
      type: object
      required: [name, percentage]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        percentage: { type: number }
        amount: { type: number, nullable: true }
        dueDate: { type: string, nullable: true }
        invoiceNumber: { type: string, nullable: true }
        sortOrder: { type: integer }
        workstreamId: { type: string, nullable: true }

    UpdateBillingMilestoneBody:
      type: object
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        percentage: { type: number }
        amount: { type: number, nullable: true }
        dueDate: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/BillingMilestoneStatus" }
        invoiceNumber: { type: string, nullable: true }
        invoicedAt: { type: string, nullable: true }
        paidAt: { type: string, nullable: true }
        reportUrl: { type: string, nullable: true }
        sortOrder: { type: integer }
        workstreamId: { type: string, nullable: true }

    RevenueRecognitionMilestone:
      type: object
      required: [id, name, status, dpp, gross, recognized, hasBast, invoiced]
      properties:
        id: { type: string }
        name: { type: string }
        workstreamName: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/BillingMilestoneStatus" }
        dpp: { type: number }
        gross: { type: number }
        recognized: { type: boolean }
        basis: { type: string, nullable: true, description: "BAST, PAID or REPORT when recognized" }
        hasBast: { type: boolean }
        invoiced: { type: boolean }
        reportUrl: { type: string, nullable: true }
        reportFiledAt: { type: string, nullable: true }
        recognizedAt: { type: string, nullable: true }

    RevenueRecognitionProject:
      type: object
      required: [projectId, code, name, status, totalDpp, totalGross, recognizedDpp, recognizedGross, unrecognizedDpp, recognizedPct, milestoneCount, recognizedCount, milestones]
      properties:
        projectId: { type: string }
        code: { type: string }
        name: { type: string }
        clientName: { type: string, nullable: true }
        pmId: { type: string, nullable: true }
        pmName: { type: string, nullable: true }
        status: { type: string }
        totalDpp: { type: number }
        totalGross: { type: number }
        recognizedDpp: { type: number }
        recognizedGross: { type: number }
        unrecognizedDpp: { type: number }
        recognizedPct: { type: number }
        milestoneCount: { type: integer }
        recognizedCount: { type: integer }
        milestones:
          type: array
          items: { $ref: "#/components/schemas/RevenueRecognitionMilestone" }

    RevenueRecognitionPmGroup:
      type: object
      required: [pmName, projectCount, totalDpp, recognizedDpp, recognizedPct]
      properties:
        pmId: { type: string, nullable: true }
        pmName: { type: string }
        projectCount: { type: integer }
        totalDpp: { type: number }
        recognizedDpp: { type: number }
        recognizedPct: { type: number }

    RevenueRecognitionTotals:
      type: object
      required: [totalDpp, totalGross, recognizedDpp, recognizedGross, unrecognizedDpp, recognizedPct, projectCount, milestoneCount, recognizedCount]
      properties:
        totalDpp: { type: number }
        totalGross: { type: number }
        recognizedDpp: { type: number }
        recognizedGross: { type: number }
        unrecognizedDpp: { type: number }
        recognizedPct: { type: number }
        projectCount: { type: integer }
        milestoneCount: { type: integer }
        recognizedCount: { type: integer }

    RevenueRecognitionBuGroup:
      type: object
      required: [businessUnitName, projectCount, milestoneCount, totalDpp, recognizedDpp, recognizedPct]
      properties:
        businessUnitId: { type: string, nullable: true }
        businessUnitName: { type: string }
        projectCount: { type: integer }
        milestoneCount: { type: integer }
        totalDpp: { type: number }
        recognizedDpp: { type: number }
        recognizedPct: { type: number }

    RevenueRecognitionPmoGroup:
      type: object
      required: [directorName, projectCount, totalDpp, recognizedDpp, recognizedPct]
      properties:
        directorId: { type: string, nullable: true }
        directorName: { type: string }
        projectCount: { type: integer }
        totalDpp: { type: number }
        recognizedDpp: { type: number }
        recognizedPct: { type: number }

    RevenueRecognition:
      type: object
      required: [totals, projects, byPm, byBusinessUnit, byPmoDirector]
      properties:
        totals: { $ref: "#/components/schemas/RevenueRecognitionTotals" }
        projects:
          type: array
          items: { $ref: "#/components/schemas/RevenueRecognitionProject" }
        byPm:
          type: array
          items: { $ref: "#/components/schemas/RevenueRecognitionPmGroup" }
        byBusinessUnit:
          type: array
          items: { $ref: "#/components/schemas/RevenueRecognitionBuGroup" }
        byPmoDirector:
          type: array
          items: { $ref: "#/components/schemas/RevenueRecognitionPmoGroup" }

    TaskDependencyRef:
      type: object
      required: [id, dependsOnTaskId]
      properties:
        id: { type: string }
        dependsOnTaskId: { type: string }
        dependsOnTitle: { type: string, nullable: true }

    Task:
      type: object
      required: [id, projectId, title, status, progressPercent, billable, loggedHours, assignees, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        workstreamId: { type: string, nullable: true }
        projectCode: { type: string, nullable: true }
        projectName: { type: string, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/TaskStatus" }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        billable: { type: boolean }
        plannedHours: { type: number, nullable: true, description: "Hour cap for this task (all users, non-rejected timesheets); null = uncapped" }
        timesheetHours: { type: number, description: "Total non-rejected timesheet hours clocked against this task" }
        startDate: { type: string, nullable: true }
        endDate: { type: string, nullable: true }
        assigneeId: { type: string, nullable: true }
        assigneeName: { type: string, nullable: true }
        assignees:
          type: array
          items: { $ref: "#/components/schemas/TaskAssignee" }
        parentTaskId: { type: string, nullable: true }
        subtaskCount: { type: integer }
        dependencies:
          type: array
          items: { $ref: "#/components/schemas/TaskDependencyRef" }
        createdById: { type: string, nullable: true }
        createdByName: { type: string, nullable: true }
        loggedHours: { type: number }
        createdAt: { type: string }
        updatedAt: { type: string }

    CreateTaskBody:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/TaskStatus" }
