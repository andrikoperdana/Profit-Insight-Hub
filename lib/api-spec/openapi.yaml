        notes: { type: string, nullable: true }
        lostReason: { type: string, nullable: true }
        competitorWon: { type: string, nullable: true }
        convertedProjectId: { type: string, nullable: true }
        wonAt: { type: string, nullable: true }
        lostAt: { type: string, nullable: true }
        nextActionAt: { type: string, nullable: true }
        followupOverdue: { type: boolean, nullable: true }
