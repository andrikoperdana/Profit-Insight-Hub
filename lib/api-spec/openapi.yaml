        width: { type: number, nullable: true }
        total: { type: string, nullable: true, enum: [sum, avg, min, max, null] }
        fixed: { type: number, nullable: true }
        badgeMap:
          type: object
          nullable: true
          additionalProperties: { type: string }

    ReportChartSpec:
      type: object
      required: [type, xKey, yKey]
      properties:
        type: { type: string, enum: [bar, line, pie] }
        xKey: { type: string }
        yKey:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        yLabel: { type: string, nullable: true }
        stacked: { type: boolean, nullable: true }

    ReportMeta:
      type: object
      required: [id, name, description, category, scope, filters, columns]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string, enum: [profitability, operations, cashflow, compliance] }
        scope:
          type: array
          items: { $ref: "#/components/schemas/UserRole" }
        filters:
          type: array
          items: { $ref: "#/components/schemas/ReportFilterSpec" }
        columns:
          type: array
          items: { $ref: "#/components/schemas/ReportColumnSpec" }
        chart:
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/ReportChartSpec" }

    ReportResult:
      type: object
      required: [id, name, description, columns, rows]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        columns:
          type: array
          items: { $ref: "#/components/schemas/ReportColumnSpec" }
        chart:
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/ReportChartSpec" }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        totals:
          type: object
          nullable: true
          additionalProperties: true
