components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    SuccessMessage:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        message: { type: string }

    UserRole:
      type: string
      enum: [MANAGEMENT, PROJECT_MANAGER, SALES, KONSULTAN, TECHNICAL_WRITER, ADMIN_PROJECT, PRINCIPAL_KONSULTAN, PRINCIPAL_TECHNICAL_WRITER, PRINCIPAL_ADMIN_PROJECT, SITE_ADMIN]

    ProjectStatus:
      type: string
      enum: [DRAFT, OBSERVATION, ACTIVE, NO_NEED_CONSULTANT, PAUSE, COMPLETE, CLOSED]

    TimesheetStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED]

    DocumentType:
      type: string
      enum: [BAST, INVOICE, CONTRACT, OTHER]

    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, BLOCKED, DONE]

    Seniority:
      type: string
      enum: [JUNIOR, MID, SENIOR, PRINCIPAL]

    ExpenseStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    TaskAssignee:
      type: object
      required: [userId, name]
      properties:
        userId: { type: string }
        name: { type: string }

    VatRecapMonth:
      type: object
      required: [month, monthLabel, milestoneCount, invoicedCount, paidCount, totalGross, totalDPP, totalVat, paidVat, outstandingVat]
      properties:
        month: { type: string, description: "YYYY-MM" }
        monthLabel: { type: string }
        milestoneCount: { type: integer }
        invoicedCount: { type: integer }
        paidCount: { type: integer }
        totalGross: { type: number }
        totalDPP: { type: number }
        totalVat: { type: number }
        paidVat: { type: number }
        outstandingVat: { type: number }

    VatRecapTotals:
      type: object
      required: [milestoneCount, totalGross, totalDPP, totalVat, paidVat, outstandingVat]
      properties:
        milestoneCount: { type: integer }
        totalGross: { type: number }
        totalDPP: { type: number }
        totalVat: { type: number }
        paidVat: { type: number }
        outstandingVat: { type: number }

    VatRecap:
      type: object
      required: [year, months, totals]
      properties:
        year: { type: integer }
        months:
          type: array
          items: { $ref: "#/components/schemas/VatRecapMonth" }
        totals: { $ref: "#/components/schemas/VatRecapTotals" }

    BillingMilestoneStatus:
      type: string
      enum: [PLANNED, INVOICED, PAID, CANCELLED]

    BillingMilestone:
      type: object
      required: [id, projectId, name, percentage, status, sortOrder, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        percentage: { type: number }
        amount: { type: number, nullable: true }
        dueDate: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/BillingMilestoneStatus" }
        invoiceNumber: { type: string, nullable: true }
        invoicedAt: { type: string, nullable: true }
        paidAt: { type: string, nullable: true }
        sortOrder: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }

    CreateBillingMilestoneBody:
      type: object
      required: [name, percentage]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        percentage: { type: number }
        amount: { type: number, nullable: true }
        dueDate: { type: string, nullable: true }
        invoiceNumber: { type: string, nullable: true }
        sortOrder: { type: integer }

    UpdateBillingMilestoneBody:
      type: object
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        percentage: { type: number }
        amount: { type: number, nullable: true }
        dueDate: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/BillingMilestoneStatus" }
        invoiceNumber: { type: string, nullable: true }
        invoicedAt: { type: string, nullable: true }
        paidAt: { type: string, nullable: true }
        sortOrder: { type: integer }

    TaskDependencyRef:
      type: object
      required: [id, dependsOnTaskId]
      properties:
        id: { type: string }
        dependsOnTaskId: { type: string }
        dependsOnTitle: { type: string, nullable: true }

    Task:
      type: object
      required: [id, projectId, title, status, progressPercent, billable, loggedHours, assignees, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        projectCode: { type: string, nullable: true }
        projectName: { type: string, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/TaskStatus" }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        billable: { type: boolean }
        startDate: { type: string, nullable: true }
        endDate: { type: string, nullable: true }
        assigneeId: { type: string, nullable: true }
        assigneeName: { type: string, nullable: true }
        assignees:
          type: array
          items: { $ref: "#/components/schemas/TaskAssignee" }
        parentTaskId: { type: string, nullable: true }
        subtaskCount: { type: integer }
        dependencies:
          type: array
          items: { $ref: "#/components/schemas/TaskDependencyRef" }
        createdById: { type: string, nullable: true }
        createdByName: { type: string, nullable: true }
        loggedHours: { type: number }
        createdAt: { type: string }
        updatedAt: { type: string }

    CreateTaskBody:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/TaskStatus" }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        billable: { type: boolean }
        startDate: { type: string, nullable: true }
        endDate: { type: string, nullable: true }
        assigneeId: { type: string, nullable: true }
        assigneeIds:
          type: array
          items: { type: string }
        parentTaskId: { type: string, nullable: true }
        dependencyTaskIds:
          type: array
          items: { type: string }

    UpdateTaskBody:
      type: object
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/TaskStatus" }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        billable: { type: boolean }
        startDate: { type: string, nullable: true }
        endDate: { type: string, nullable: true }
        assigneeId: { type: string, nullable: true }
        assigneeIds:
          type: array
          items: { type: string }
        parentTaskId: { type: string, nullable: true }
        dependencyTaskIds:
          type: array
          items: { type: string }

    TaskTimeLog:
      type: object
      required: [id, taskId, userId, hours, loggedAt, createdAt]
      properties:
        id: { type: string }
        taskId: { type: string }
        userId: { type: string }
        userName: { type: string, nullable: true }
        hours: { type: number }
        note: { type: string, nullable: true }
        loggedAt: { type: string }
        createdAt: { type: string }

    LogTaskTimeBody:
      type: object
      required: [hours]
      properties:
        hours: { type: number }
        note: { type: string }
        loggedAt: { type: string }

    User:
      type: object
      required: [id, email, name, role, isActive, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        title: { type: string, nullable: true }
        dailyRate: { type: number, nullable: true }
        seniority: { type: string, nullable: true, enum: [JUNIOR, MID, SENIOR, PRINCIPAL, null] }
        businessUnitId: { type: string, nullable: true }
        businessUnitName: { type: string, nullable: true }
        skills:
          type: array
          items: { $ref: "#/components/schemas/UserSkillInfo" }
        isActive: { type: boolean }
        managerId: { type: string, nullable: true }
        principalId: { type: string, nullable: true }
        createdAt: { type: string }

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    CreateUserBody:
      type: object
      required: [email, password, name, role]
      properties:
        email: { type: string }
        password: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        title: { type: string }
        dailyRate: { type: number }
        seniority: { type: string, nullable: true, enum: [JUNIOR, MID, SENIOR, PRINCIPAL, null] }
        businessUnitId: { type: string, nullable: true }
        skillIds:
          type: array
          items: { type: string }
        managerId: { type: string, nullable: true }
        principalId: { type: string, nullable: true }

    UpdateUserBody:
      type: object
      properties:
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        title: { type: string }
        dailyRate: { type: number }
        seniority: { type: string, nullable: true, enum: [JUNIOR, MID, SENIOR, PRINCIPAL, null] }
        businessUnitId: { type: string, nullable: true }
        skillIds:
          type: array
          items: { type: string }
        isActive: { type: boolean }
        password: { type: string }
        managerId: { type: string, nullable: true }
        principalId: { type: string, nullable: true }

    LeadStage:
      type: string
      enum: [NEW, QUALIFIED, PROPOSAL, NEGOTIATION, WON, LOST]

