openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SecureProfit Hub API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: clients
  - name: projects
  - name: resources
  - name: timesheets
  - name: documents
  - name: expenses
  - name: tasks
  - name: dashboard
  - name: notifications
  - name: report
  - name: reports
  - name: raid
  - name: performance-reviews
  - name: pipedrive
  - name: executive-copilot
  - name: ai
  - name: access-requests

paths:
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReportMeta" }
  /reports/options:
    get:
      operationId: getReportOptions
      tags: [reports]
      parameters:
        - { name: source, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReportFilterOption" }
  /reports/{id}:
    get:
      operationId: executeReport
      tags: [reports]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportResult" }

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }

  /users/available:
    get:
      operationId: listAvailableUsers
      tags: [users]
      parameters:
        - name: role
          in: query
          required: true
          schema: { $ref: "#/components/schemas/UserRole" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AvailableUser" }

  /users/active-all:
    get:
      operationId: listActiveAllUsers
      tags: [users]
      description: |
        Returns all active users regardless of role. Available to MANAGEMENT and
        PROJECT_MANAGER. Used by the project Resources tab to assign "other"
        resources (Sales, SOC Manager, Security Engineer, etc.) with a free-text
        project role.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActiveUser" }

  /projects/{id}/report:
    patch:
      operationId: updateProjectReport
      tags: [report]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectReportBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /projects/{id}/reports:
    get:
      operationId: listProjectReports
      tags: [report]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectReportPage" }
    post:
      operationId: createProjectReport
      tags: [report]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectReportBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectReport" }

  /project-reports/{reportId}:
    patch:
      operationId: updateProjectReportItem
      tags: [report]
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectReportItemBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectReport" }
    delete:
      operationId: deleteProjectReport
      tags: [report]
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /auth/google/config:
    get:
      operationId: getGoogleAuthConfig
      tags: [auth]
      responses:
        "200":
          description: Public Google SSO configuration (clientId is null when SSO is not configured)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleAuthConfig" }

  /auth/google:
    post:
      operationId: googleLogin
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleLoginBody" }
      responses:
        "200":
          description: Signed in, or an access request was created/is pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleLoginResponse" }

  /access-requests:
    get:
      operationId: listAccessRequests
      tags: [access-requests]
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/AccessRequestStatus" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessRequest" }

  /access-requests/{id}/approve:
    post:
      operationId: approveAccessRequest
      tags: [access-requests]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveAccessRequestBody" }
      responses:
        "201":
          description: User created from the access request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /access-requests/{id}/reject:
    post:
      operationId: rejectAccessRequest
      tags: [access-requests]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequest" }

  /users:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      operationId: createUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      operationId: updateUser
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    delete:
      operationId: deleteUser
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Lead" }
    post:
      operationId: createLead
      tags: [leads]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLeadBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }

  /leads/{id}:
    patch:
      operationId: updateLead
      tags: [leads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLeadBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
    delete:
      operationId: deleteLead
      tags: [leads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /leads/analytics:
    get:
      operationId: getLeadsAnalytics
      tags: [leads]
      parameters:
        - { name: from, in: query, required: false, schema: { type: string } }
        - { name: to, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadAnalytics" }

  /leads/{id}/activities:
    get:
      operationId: listLeadActivities
      tags: [leads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeadActivity" }
    post:
      operationId: createLeadActivity
      tags: [leads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLeadActivityBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadActivity" }

  /leads/{id}/activities/{activityId}:
    patch:
      operationId: updateLeadActivity
      tags: [leads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: activityId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLeadActivityBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadActivity" }
    delete:
      operationId: deleteLeadActivity
      tags: [leads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: activityId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /leads/import:
    post:
      operationId: importLeads
      tags: [leads]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportLeadsBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportLeadsResult" }

  /leads/sales-users:
    get:
      operationId: listSalesUsers
      tags: [leads]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeadOwnerOption" }

  /leads/reassign:
    post:
      operationId: reassignLeads
      tags: [leads]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReassignLeadsBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReassignLeadsResult" }

  /leads/{id}/convert:
    post:
      operationId: convertLead
      tags: [leads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConvertLeadBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConvertLeadResult" }

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Client" }
    post:
      operationId: createClient
      tags: [clients]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClientBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }

  /clients/{id}:
    patch:
      operationId: updateClient
      tags: [clients]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClientBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
    delete:
      operationId: deleteClient
      tags: [clients]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
    patch:
      operationId: updateProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
    delete:
      operationId: deleteProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /projects/{id}/financials:
    get:
      operationId: getProjectFinancials
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectFinancials" }

  /projects/{id}/replace-pm:
    post:
      operationId: replaceProjectPm
      tags: [projects]
      description: |
        Replace the Project Manager on a running (non-DRAFT) project.
        MANAGEMENT only. Requires a reason; records a project activity entry
        and notifies both the new and previous PM.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceProjectPmBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /projects/{id}/resources:
    get:
      operationId: listProjectResources
      tags: [resources]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectResource" }
    post:
      operationId: addProjectResource
      tags: [resources]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddResourceBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResource" }

  /resources/{resourceId}:
    delete:
      operationId: removeProjectResource
      tags: [resources]
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /projects/{id}/resources/bulk:
    post:
      operationId: addProjectResourcesBulk
      tags: [resources]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkAddResourcesBody" }
      responses:
        "201":
          description: Per-row create result (partial mode — valid rows are created, invalid rows are reported in `errors`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkAddResourcesResponse" }

  /projects/{id}/resources/propose:
    post:
      operationId: proposeProjectResource
      tags: [resources]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddResourceBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResource" }

  /resources/{resourceId}/accept:
    post:
      operationId: acceptProjectResource
      tags: [resources]
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /resources/{resourceId}/reject:
    post:
      operationId: rejectProjectResource
      tags: [resources]
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }

  /resources/{resourceId}/rates:
    get:
      operationId: listResourceRates
      tags: [resources]
      description: |
        Append-only rate history for a project resource, newest first.
        Restricted to canViewDailyRate roles (MGMT / assigned PM / SUPER_ADMIN).
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ResourceRate" }
    post:
      operationId: createResourceRate
      tags: [resources]
      description: |
        Adds a rate period. The resource's denormalized dailyRate is re-synced
        to the newest period already in effect. sellingRate is display-only.
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateResourceRateBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceRate" }

  /principal/pending-resource-approvals:
    get:
      operationId: listPendingResourceApprovals
      tags: [principal]
      description: |
        Lists ProjectResource rows awaiting the calling Principal's approval —
        PM-added supervised users (KONSULTAN / TECHNICAL_WRITER) whose
        principalId equals the caller.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PendingResourceApproval" }

  /principal/projects-needing-resource:
    get:
      operationId: listProjectsNeedingResource
      tags: [principal]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }

  /principal/team-projects:
    get:
      operationId: listPrincipalTeamProjects
      tags: [principal]
      description: |
        Returns each direct supervisee of the calling Principal with the list of
        projects they are currently assigned to (status OBSERVATION / ACTIVE /
        PAUSE / COMPLETE), including project start/end dates so the Principal
        can see when each assignment wraps up.
      responses:
        "200":
          description: OK
          content:
