  # drizzle-kit uses esbuild internally on an older version that's vulnerable, this overrides it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  # GHSA-g7r4-m6w7-qqqr: esbuild arbitrary file read in dev server (Windows alternate paths)
  esbuild: "^0.28.1"
  # ── Security CVE overrides ──────────────────────────────────────────────────
  # GHSA-v2wj-q39q-566r / GHSA-p9ff-h696-f583 / GHSA-4w7w-66w2-5vf9: vite CVEs
  # GHSA-fx2h-pf6j-xcff / GHSA-v6wh-96g9-6wx3: vite fs.deny bypass + NTLMv2 hash disclosure
  # Global override forces vitest's bundled vite peer to also use the patched version
  vite: "^7.3.5"
  # GHSA-3v7f-55p6-f55p / GHSA-c2c7-rcm5-vvqj: picomatch ReDoS (2.x path)
  "micromatch>picomatch": "^2.3.2"
  # GHSA-3v7f-55p6-f55p / GHSA-c2c7-rcm5-vvqj: picomatch ReDoS (4.x path via vitest/vite)
  "vitest>picomatch": "^4.0.4"
  "vite>picomatch": "^4.0.4"
  # GHSA-q8mj-m7cp-5q26: qs DoS via stringify with null values
  qs: "^6.15.2"
  # GHSA-v39h-62p7-jpjc / GHSA-q3j6-qgpj-74h6: fast-uri path traversal / host confusion
  fast-uri: "^3.1.2"
  # GHSA-qx2v-qp2m-jg93: PostCSS XSS via unescaped </style>
  postcss: "^8.5.10"
  # GHSA-w5hq-g745-h8pq: uuid missing buffer bounds check in v3/v5/v6
  uuid: "^11.1.1"
  # GHSA-27v5-c462-wpq7 / GHSA-j3q9-mxjg-w52f: path-to-regexp ReDoS
  # Scoped to the `router` npm package only — express@4's own path-to-regexp@0.1.x
  # must NOT be overridden (different major API, would break Express route matching)
  "router>path-to-regexp": "^8.4.0"
  # GHSA-48c2-rrv3-qjmp: yaml prototype pollution / ReDoS
  yaml: "^2.8.3"
  # GHSA-f886-m6hf-6m8v: brace-expansion zero-step sequence hangs
  brace-expansion: "^2.0.3"
  # GHSA-f23m-r3pf-42rh / GHSA-r5fr-rjxr-66jc: lodash prototype pollution / code injection
  lodash: "^4.18.0"
  # GHSA-ph9p-34f9-6g65: tmp predictable temp-file names (symlink attack)
  # GHSA-7c78-jf6q-g5cm: tmp type-confusion path traversal
  tmp: "^0.2.7"
  # GHSA-72gw-mp4g-v24j / GHSA-3p4h-7m6x-2hcm: multer DoS via deeply nested fields / incomplete abort cleanup
  multer: "^2.2.0"
  # GHSA-hmw2-7cc7-3qxx: form-data CRLF injection via unescaped field names/filenames
  form-data: "^4.0.6"
  # GHSA-76mc-f452-cxcm / GHSA-hpcv-96wg-7vj8 / GHSA-r47g-fvhr-h676 / GHSA-rp9w-3fw7-7cwq / GHSA-vxr8-fq34-vvx9 / GHSA-gvmj-g25r-r7wr: multiple DOMPurify XSS bypasses
  # Note: GHSA-x4vx-rjvf-j5p4 has no upstream patch; all others are fixed in >=3.4.9
  dompurify: "^3.4.9"
  # GHSA-4x5r-pxfx-6jf8: @babel/core arbitrary file read via sourceMappingURL comment
  "@babel/core": "^7.29.6"
  # GHSA-h67p-54hq-rp68: js-yaml quadratic-complexity DoS in merge key handling
  js-yaml: "^4.2.0"
  # GHSA-6v5v-wf23-fmfq: markdown-it quadratic complexity DoS in smartquotes rule
  markdown-it: "^14.2.0"

packageExtensions:
  # react-native-worklets@0.5.x's babel plugin does a bare `require("@babel/generator")`
  # but never declares it. It used to resolve via hoisting, but the `@babel/core` override
  # above re-isolated worklets into a subtree where @babel/generator is no longer reachable,
  # crashing the Metro/babel transform with "Cannot find module '@babel/generator'" and
  # breaking the Expo mobile production build. Declare it so pnpm links it into the subtree.
  react-native-worklets:
    dependencies:
      "@babel/generator": "^7.29.6"